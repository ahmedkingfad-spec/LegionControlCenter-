name: Build Legion Control Center APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug & Release APK (with automatic retry for Maven rate-limits)
        run: |
          for attempt in 1 2 3 4; do
            echo "Build attempt $attempt..."
            if gradle assembleDebug assembleRelease --no-daemon --stacktrace; then
              echo "Build succeeded!"
              exit 0
            fi
            sleep $((attempt * 25))
          done
          exit 1

      - name: Upload Legion Control Center APK
        uses: actions/upload-artifact@v4
        with:
          name: LegionControlCenter-Raven-APK
          path: app/build/outputs/apk/debug/app-debug.apk
